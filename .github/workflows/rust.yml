---
name: PR Checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.89.0"
          components: clippy, rustfmt
      - run: python3 -m venv .venv-reference-models
      - run: .venv-reference-models/bin/python -m pip install -r tools/reference_models/requirements.txt
      - run: .venv-reference-models/bin/python tools/reference_models/check.py
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
