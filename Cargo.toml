[package]
name = "cygnus-core"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
authors = ["Shane Jaroch <shane@nutra.tk>"]
license = "MIT OR Apache-2.0"
repository = "https://git.nutra.tk/gamesguru/cygnus-core"
description = "Client-side core for MSC00FC (Cygnus) self-certifying Matrix identities: links, principals, verification."
keywords = ["matrix", "identity", "ed25519", "cygnus"]
categories = ["cryptography"]
readme = "README.md"

[workspace]
members = [".", "cygnus-dmls", "cygnus-wasm"]

[dependencies]
base64 = "0.23"
blake3 = { version = "1.5", default-features = false }
ed25519-zebra = { version = "5", default-features = false }
rand_core = { version = "0.10", default-features = false }
sha2 = "0.11"
# Pinned to a `dev` commit that carries the strict `Value` canonical writer.
# Bump the rev deliberately; keep it identical across every rezzy dependency.
rezzy-json = { git = "https://gitlab.com/wombat-foundation/rezzy.git", rev = "ab3aed082b596ef2ab61b327c1b7c65439a4e540" }
# Matrix v12 auth and state resolution for the P2-P5 checks. Optional so
# client and wasm builds do not compile the state engine.
rezzy = { git = "https://gitlab.com/wombat-foundation/rezzy.git", rev = "ab3aed082b596ef2ab61b327c1b7c65439a4e540", optional = true }

[features]
default = []
state-res = ["dep:rezzy"]
# Exposes unchecked epoch constructors for tests. Never enable in production.
test-support = []

[dev-dependencies]
cygnus-core = { path = ".", features = ["test-support"] }
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
