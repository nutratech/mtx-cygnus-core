[package]
name = "cygnus-core"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
license = "MIT OR Apache-2.0"
description = "Client-side core for MSC00FC (Cygnus) self-certifying Matrix identities: links, principals, verification."
keywords = ["matrix", "identity", "ed25519", "cygnus"]
categories = ["cryptography"]
readme = "README.md"

[workspace]
members = [".", "cygnus-wasm"]

[dependencies]
base64 = "0.22"
ed25519-zebra = { version = "4", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = "0.10"
# Tracks the `dev` branch of rezzy, which carries the strict `Value` canonical
# writer. Pinned by branch (not rev), so `cargo update -p rezzy-json` moves it.
rezzy-json = { git = "https://gitlab.com/wombat-foundation/rezzy.git", branch = "dev" }
# Matrix v12 auth and state resolution for the P2-P5 checks. Optional so
# client and wasm builds do not compile the state engine.
rezzy = { git = "https://gitlab.com/wombat-foundation/rezzy.git", branch = "dev", optional = true }

[features]
default = []
state-res = ["dep:rezzy"]
# Exposes unchecked epoch constructors for tests. Never enable in production.
test-support = []
# Experimental zero-curve hash-based signatures (WOTS+). Not used by the protocol.
wots-experimental = []

[dev-dependencies]
cygnus-core = { path = ".", features = ["test-support"] }
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"

# WOTS+ chains run hundreds of thousands of hashes; keep SHA-256 fast in tests.
[profile.dev.package.sha2]
opt-level = 3
