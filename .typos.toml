[default]
# Base64url blobs (test vectors, links) and long hex digests are not prose.
extend-ignore-re = ["[A-Za-z0-9_-]{40,}"]

[default.extend-words]

[files]
# Vendored verbatim from the proposals repo; do not rewrite or spell-check.
extend-exclude = ["Cargo.lock", "tests/vectors/", "tools/reference_models/"]
